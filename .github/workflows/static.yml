# 简单工作流：将静态内容部署到 GitHub Pages
名称: 将静态内容部署到 Pages

on:
  # 当推送到 main 分支时触发
  push:
    分支: ["main"]

  # 允许从 Actions 标签页手动触发此工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: 写入

# 仅允许一个并发部署，跳过正在运行和最新排队之间排队的运行
# 但是，不要取消正在进行的运行，因为我们要让这些生产部署完成
并发:
  组: "pages"
  取消中: false

作业:
  # 单部署作业，因为我们只是在部署
部署:
    环境:
      名称: github-pages
      URL: ${{ steps.deployment.outputs.page_url }}
    运行平台: ubuntu-latest
    步骤:
      - name: 检出代码
        使用: actions/checkout@v4
      - name: 设置 Pages
        使用: actions/configure-pages@v5
      - name: 上传产物
        使用: actions/upload-pages-artifact@v3
        with:
          # 上传整个仓库
          path: '.'
      - name: 部署到 GitHub Pages
        id: deployment
        使用: actions/deploy-pages@v5
